<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Visualizer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #1a1a2e, #0a0a12 70%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 10px 0 20px;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 20px rgba(120,180,255,0.5);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  button, select, label.file-btn {
    background: #1e1e2f;
    border: 1px solid #3a3a55;
    color: #eee;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.2s;
  }
  button:hover, label.file-btn:hover {
    background: #2c2c45;
    border-color: #6a6aff;
  }
  button.active {
    background: #4a4aff;
    border-color: #6a6aff;
  }
  input[type=file] { display: none; }
  canvas {
    background: #05050a;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(80,80,255,0.15);
    max-width: 100%;
  }
  #status {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #999;
    text-align: center;
  }
  audio {
    margin-top: 14px;
    width: 100%;
    max-width: 900px;
  }
</style>
</head>
<body>

<h1>🎧 Audio Visualizer</h1>

<div class="controls">
  <button id="micBtn">🎙️ Gunakan Mic</button>
  <label class="file-btn" for="fileInput">📁 Upload Audio</label>
  <input type="file" id="fileInput" accept="audio/*">
  <select id="modeSelect">
    <option value="bars">Bar</option>
    <option value="wave">Gelombang</option>
    <option value="circle">Lingkaran</option>
  </select>
  <button id="playPauseBtn" disabled>▶️ Play</button>
</div>

<canvas id="canvas" width="900" height="400"></canvas>
<audio id="audioPlayer" controls style="display:none;"></audio>
<div id="status">Pilih mic atau upload file audio untuk mulai.</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const micBtn = document.getElementById('micBtn');
const fileInput = document.getElementById('fileInput');
const modeSelect = document.getElementById('modeSelect');
const playPauseBtn = document.getElementById('playPauseBtn');
const audioPlayer = document.getElementById('audioPlayer');
const statusEl = document.getElementById('status');

let audioCtx, analyser, source, dataArray, bufferLength;
let animationId;
let mode = 'bars';
let hue = 200;

function setupAnalyser() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (!analyser) {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
  }
}

function stopCurrentSource() {
  if (source) {
    try { source.disconnect(); } catch(e) {}
  }
  if (animationId) cancelAnimationFrame(animationId);
}

async function useMic() {
  try {
    stopCurrentSource();
    audioPlayer.pause();
    audioPlayer.style.display = 'none';
    playPauseBtn.disabled = true;

    setupAnalyser();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    // jangan connect ke destination supaya tidak feedback speaker

    statusEl.textContent = '🎙️ Mendengarkan dari mikrofon...';
    micBtn.classList.add('active');
    draw();
  } catch (err) {
    statusEl.textContent = 'Gagal mengakses mikrofon: ' + err.message;
  }
}

function useFile(file) {
  stopCurrentSource();
  micBtn.classList.remove('active');
  setupAnalyser();

  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = 'block';
  playPauseBtn.disabled = false;
  playPauseBtn.textContent = '▶️ Play';

  source = audioCtx.createMediaElementSource(audioPlayer);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  statusEl.textContent = '📁 File dimuat: ' + file.name;
}

playPauseBtn.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (audioPlayer.paused) {
    audioPlayer.play();
    playPauseBtn.textContent = '⏸️ Pause';
    draw();
  } else {
    audioPlayer.pause();
    playPauseBtn.textContent = '▶️ Play';
  }
});

audioPlayer.addEventListener('ended', () => {
  playPauseBtn.textContent = '▶️ Play';
});

micBtn.addEventListener('click', useMic);
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) useFile(e.target.files[0]);
});
modeSelect.addEventListener('change', (e) => mode = e.target.value);

// Auto-load "i.mp3" dari folder yang sama dengan file HTML ini
const AUTO_FILE = 'i.mp3';
function tryAutoLoad() {
  setupAnalyser();
  audioPlayer.src = AUTO_FILE;
  audioPlayer.style.display = 'block';

  audioPlayer.addEventListener('canplay', () => {
    if (!source) {
      source = audioCtx.createMediaElementSource(audioPlayer);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
    playPauseBtn.disabled = false;
    statusEl.textContent = '📁 "' + AUTO_FILE + '" berhasil dimuat otomatis. Klik Play untuk mulai.';
  }, { once: true });

  audioPlayer.addEventListener('error', () => {
    statusEl.textContent = '⚠️ Tidak bisa menemukan "' + AUTO_FILE + '" di folder yang sama. Pastikan file itu ada di folder yang sama dengan file HTML ini, lalu refresh. Atau upload manual lewat tombol di atas.';
  }, { once: true });
}
tryAutoLoad();

function draw() {
  animationId = requestAnimationFrame(draw);
  analyser.getByteFrequencyData(dataArray);

  ctx.fillStyle = 'rgba(5,5,10,0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  hue = (hue + 0.3) % 360;

  if (mode === 'bars') drawBars();
  else if (mode === 'wave') drawWave();
  else if (mode === 'circle') drawCircle();
}

function drawBars() {
  const barWidth = (canvas.width / bufferLength) * 2.2;
  let x = 0;
  for (let i = 0; i < bufferLength; i++) {
    const v = dataArray[i] / 255;
    const barHeight = v * canvas.height * 0.9;
    const color = `hsl(${(hue + i * 2) % 360}, 90%, 60%)`;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
    x += barWidth;
  }
  ctx.shadowBlur = 0;
}

function drawWave() {
  analyser.getByteTimeDomainData(dataArray);
  ctx.lineWidth = 3;
  ctx.strokeStyle = `hsl(${hue}, 90%, 65%)`;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  const sliceWidth = canvas.width / bufferLength;
  let x = 0;
  for (let i = 0; i < bufferLength; i++) {
    const v = dataArray[i] / 128.0;
    const y = (v * canvas.height) / 2;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawCircle() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = 80;
  ctx.save();
  ctx.translate(cx, cy);
  for (let i = 0; i < bufferLength; i++) {
    const v = dataArray[i] / 255;
    const angle = (i / bufferLength) * Math.PI * 2;
    const len = v * 150;
    const color = `hsl(${(hue + i * 3) % 360}, 90%, 60%)`;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
    ctx.lineTo(Math.cos(angle) * (radius + len), Math.sin(angle) * (radius + len));
    ctx.stroke();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}
</script>
</body>
  </html>
